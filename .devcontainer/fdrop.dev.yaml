# fdrop configuration for the dev container. Development values only: never use these secrets elsewhere.
http:
  # HTTPS only: nothing listens on plain HTTP. The certificates are made by the `certs` service of compose.yaml.
  port: 8443
  tls: { cert: .devcontainer/certs/server.crt, key: .devcontainer/certs/server.key }
  mtls: { enabled: true, port: 8444 }
management:
  port: 8081
  metricsToken: ""
sftp:
  port: 2222
  hostKeyPath: ./data/ssh_host_ed25519_key
  spoolDir: ./data/spool
auth:
  oidc:
    issuer: ${FDROP_AUTH_OIDC_ISSUER:-https://localhost:8180/realms/fdrop}
    # dev Keycloak serves HTTPS with the dev CA's localhost certificate
    trustedCas: .devcontainer/certs/ca.crt
    webClientSecret: ${FDROP_AUTH_OIDC_WEBCLIENTSECRET:-fdrop-web-dev-secret}
    sftpClientSecret: ${FDROP_AUTH_OIDC_SFTPCLIENTSECRET:-fdrop-sftp-dev-secret}
  applications:
    mtls:
      trustedCas: .devcontainer/certs/ca.crt
  twoFactor:
    # off in dev so the dev users keep signing in with just a password; any of them can still turn it on from the
    # Account page. Start fdrop with FDROP_AUTH_TWOFACTOR_REQUIRE=admins to try the production behaviour.
    require: none
  session:
    secureCookie: true
forward:
  allowedHosts: [sftp-target]
  # fixed 32-byte development key; generate your own for anything real (openssl rand -base64 32)
  encryptionKey: ZmRyb3AtZGV2LWVuY3J5cHRpb24ta2V5LW5vdC1zZWM=
storage:
  type: local
  local:
    root: ./data/files
  encryption:
    # fixed development key; generate your own for anything real: echo "k1:$(openssl rand -base64 32)"
    local:
      keys: ${FDROP_STORAGE_ENCRYPTION_LOCAL_KEYS:-dev1:ZmRyb3AtZGV2LXN0b3JhZ2Uta2V5LW5vdC1zZWNyZXQ=}
    # files stored before encryption was added are still served; encrypt them with the re-encryption job
    allowPlaintextReads: true
db:
  # the compose `postgres` service, reached as production does: TLS with verify-full and a client certificate (CN=fdrop)
  # instead of a password. The certificates are made by the `certs` service.
  url: jdbc:postgresql://localhost:5432/fdrop
  username: fdrop
  password: ""
  tls:
    mode: verify-full
    ca: .devcontainer/certs/ca.crt
    cert: .devcontainer/certs/fdrop-db.crt
    key: .devcontainer/certs/fdrop-db.key
