# Dev Prometheus: scrapes the local fdrop management port and loads the production alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: fdrop
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8081"]
