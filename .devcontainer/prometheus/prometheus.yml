# Dev Prometheus: scrapes the local fdrop management port (HTTPS, dev CA) and loads the production alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: fdrop
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/fdrop-ca.crt
    static_configs:
      - targets: ["localhost:8081"]
