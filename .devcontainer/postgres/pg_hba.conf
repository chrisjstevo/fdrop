# Who may connect to the dev metadata DB, and how. Only TLS connections with a client certificate signed by the dev
# CA, whose CN is the DB user (fdrop), are accepted over TCP; there is no `host` line, so plain TCP and passwords
# are refused, as they should be in production.
# TYPE    DATABASE  USER  ADDRESS       METHOD
local     all       all                 trust   # initdb and `podman exec … psql` inside the container only
hostssl   all       all   127.0.0.1/32  cert
hostssl   all       all   ::1/128       cert
