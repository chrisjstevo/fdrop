# PostgreSQL settings for the dev container's metadata DB: TLS required, client certificates only (see
# "Metadata DB connection" in SPEC.md). The compose entrypoint copies the certificates to /var/lib/postgresql/tls/
# with the permissions PostgreSQL insists on before starting the server.
listen_addresses = 'localhost'
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.conf'

ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/postgres.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_ca_file = '/var/lib/postgresql/tls/ca.crt'      # the CA client certificates must chain to
ssl_min_protocol_version = 'TLSv1.2'

log_connections = on                               # shows which certificate CN connected, or why it was refused
password_encryption = scram-sha-256
