# Publishes the dev services' ports on the host, for running the dev stack from the command line rather than
# from an IDE (VS Code and IntelliJ forward ports themselves; don't use this file with them):
#   podman compose -f .devcontainer/compose.yaml -f .devcontainer/compose.host-ports.yaml up -d
# The ports go on the localhost service because dev, keycloak and prometheus share its network.
services:
  localhost:
    ports:
      - 127.0.0.1:8443:8443   # fdrop web and API (HTTPS)
      - 127.0.0.1:8081:8081   # fdrop management (metrics)
      - 127.0.0.1:8444:8444   # fdrop application mTLS
      - 127.0.0.1:2222:2222   # fdrop SFTP
      - 127.0.0.1:5173:5173   # Vite dev server
      - 127.0.0.1:8180:8180   # Keycloak
      - 127.0.0.1:9090:9090   # Prometheus
