# Runs ./mvnw verify on every push and pull request, directly on the runner: Java 21 and the .NET SDK from
# global.json are installed here, the build fetches its own Node (frontend-maven-plugin) and OpenTofu
# (fdrop-kubernetes/check.sh), and the Testcontainers integration tests use the runner's Docker.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad   # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          global-json-file: fdrop-http-client-dotnet/global.json
          cache: true
          cache-dependency-path: fdrop-http-client-dotnet/**/packages.lock.json

      - name: mvn verify
        run: ./mvnw -B -ntp verify

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            fdrop-http-client-dotnet/target/**/*.trx
          if-no-files-found: ignore
