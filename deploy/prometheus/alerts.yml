groups:
  - name: fdrop
    rules:
      - alert: FdropDown
        expr: up{job="fdrop"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: fdrop is not answering scrapes on its management port

      - alert: FdropNotReady
        expr: probe_success{job="fdrop-ready"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: fdrop /readyz is failing (metadata DB or storage unreachable)

      - alert: FdropStorageErrors
        expr: |
          sum(rate(fdrop_storage_operation_seconds_count{outcome="error"}[10m]))
            / sum(rate(fdrop_storage_operation_seconds_count[10m])) > 0.01
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: more than 1% of storage operations are failing

      - alert: FdropForwardFailing
        expr: |
          sum by (destination) (increase(fdrop_forward_failures_total[30m])) > 0
            unless sum by (destination) (increase(fdrop_forward_send_seconds_count{outcome="ok"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "forwarding to destination {{ $labels.destination }} has failed for 30 minutes"

      - alert: FdropForwardHostKeyMismatch
        expr: increase(fdrop_forward_failures_total{reason="host_key_mismatch"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "destination {{ $labels.destination }} presented an unexpected host key"
          description: The destination's host key no longer matches the pin. Check with its owner before re-pinning.

      - alert: FdropKeycloakErrors
        expr: |
          sum(rate(fdrop_keycloak_request_seconds_count{outcome="error"}[10m]))
            / sum(rate(fdrop_keycloak_request_seconds_count[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: more than 5% of calls to Keycloak are failing

      - alert: FdropSftpAuthFailureSpike
        expr: sum(increase(fdrop_sftp_auth_total{result="failure"}[5m])) > 50
        labels:
          severity: warning
        annotations:
          summary: more than 50 SFTP login failures in 5 minutes

      - alert: FdropAppAuthFailures
        expr: sum(increase(fdrop_app_auth_total{result!="success"}[5m])) > 20
        labels:
          severity: warning
        annotations:
          summary: more than 20 application account login failures in 5 minutes

      - alert: FdropAppCredentialExpiring
        expr: sum(fdrop_app_credentials_expiring{within="7d"}) > 0
        labels:
          severity: warning
        annotations:
          summary: an application account password or client certificate expires within 7 days

      - alert: FdropUploadAssemblySlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(fdrop_upload_assembly_seconds_bucket[15m]))) > 300
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 95th percentile upload assembly time is over 5 minutes

      - alert: FdropSearchIndexLag
        expr: max(fdrop_search_index_lag_seconds{job="fdrop"}) > 900
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A node's search index is more than 15 minutes behind; new files are not searchable there

      - alert: FdropSearchExtractFailing
        expr: |
          sum(increase(fdrop_search_extract_total{job="fdrop",result=~"failed|timeout"}[1h]))
            / sum(increase(fdrop_search_extract_total{job="fdrop"}[1h])) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 20% of search text extractions fail or time out

      - alert: FdropAuditWriteFailing
        expr: |
          increase(fdrop_audit_write_failures_total{job="fdrop"}[5m]) > 0
            or max(fdrop_audit_buffer_events{job="fdrop"}) > 5000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Audit events are not reaching the DB (the buffer is over half full of the default 10,000, or events were dropped); they are still in the log files

      - alert: FdropAuditChainBroken
        expr: min(fdrop_audit_chain_intact{job="fdrop"}) < 1
        labels:
          severity: critical
        annotations:
          summary: The audit log in the DB was changed after it was written; Admin, Audit log, Verify chain shows the first broken event

      - alert: FdropAuditIndexLag
        expr: max(fdrop_audit_index_lag_seconds{job="fdrop"}) > 900
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A node's audit index is more than 15 minutes behind; recent events are listed but not searchable there

      - alert: FdropDecryptionFailures
        expr: increase(fdrop_encryption_failures_total{job="fdrop"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: A stored file failed authentication on read; it was altered, damaged or cut short (see Admin, Encryption)

      - alert: FdropKmsErrors
        expr: |
          sum(rate(fdrop_encryption_kek_seconds_count{job="fdrop",outcome="error"}[5m]))
            / sum(rate(fdrop_encryption_kek_seconds_count{job="fdrop"}[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The key-encryption key provider is failing; uploads and downloads of encrypted files fail with it

      - alert: FdropPlaintextObjects
        expr: max(fdrop_encryption_objects{job="fdrop",key_id="plaintext"}) > 0
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: Unencrypted files are still stored a week on; run the re-encryption job with plaintext true

      - alert: FdropExpiryOverdue
        expr: max(fdrop_expiry_overdue_files{job="fdrop"}) > 0
        for: 55m
        labels:
          severity: warning
        annotations:
          summary: Files are still not deleted an hour after their expiry; check fdrop_expiry_deleted_total errors and storage

      - alert: FdropExpiryDeleteErrors
        expr: |
          sum(rate(fdrop_expiry_deleted_total{job="fdrop",outcome="error"}[15m]))
            / sum(rate(fdrop_expiry_deleted_total{job="fdrop"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of expiry deletions are failing

      - alert: FdropHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{job="fdrop",area="heap"})
            / sum(jvm_memory_max_bytes{job="fdrop",area="heap"}) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: fdrop JVM heap above 90% of its maximum
